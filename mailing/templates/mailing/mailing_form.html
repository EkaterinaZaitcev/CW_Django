{% extends 'mailing/index.html' %}

{% block title %}Управление рассылками{% endblock %}

{% block content %}

{% if object %}
<h2>Изменить рассылку</h2>
{% else %}
<h2>Добавить рассылку</h2>
{% endif %}


<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <!-- Выводим каждое поле формы в отдельном параграфе -->
    {{ form.as_p }}

    {% if object %}
    <a class="btn btn-outline-primary m-1" href="{% url 'mailing:mailing_update' object.pk%}">Изменить</a>
    {% else %}
     <a href="{% url 'mailing:mailing_list' %}" type="submit" class="btn btn-primary">Сохранить</a>
    {% endif %}

</form>

{% endblock %}
