{% extends 'mailing/index.html' %}

{% block content %}
<div class="container mt-5">
        <h1 class="mb-4 custom-margin">Создать сообщение</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <a href="{% url 'mailing:message_list' %}" type="submit" class="btn btn-primary">Сохранить</a>
            <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
</div>
{% endblock %}
